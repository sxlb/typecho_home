name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      # 版本号来源唯一：package.json。versionCode 用主*10000+次*100+修，保证每次升级递增
      - name: 读取版本号
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CODE=$(node -p "const [a,b,c]=require('./package.json').version.split('.').map(Number); a*10000+b*100+c")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: 读取插件版本
        id: plugin
        run: |
          VERSION=$(grep -oP "const VERSION = '\K[^']+" plugins/SxlbPublisher/Plugin.php)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 安装依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: 生成安卓工程
        run: npx cap add android

      # 写入 versionName/versionCode，并把调试签名指向仓库内的固定密钥，
      # 否则每次构建签名不同，手机上无法覆盖安装
      - name: 写入版本号与签名
        run: |
          node scripts/patch-android.mjs
          grep -n "versionCode\|versionName\|debug.keystore" android/app/build.gradle

      - name: 同步资源
        run: npx cap sync android

      - name: 打包 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 重命名产物
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sxlb-writer.apk

      # 插件单独打包，zip 根目录是 SxlbPublisher/，解压后直接放进 usr/plugins/
      - name: 打包插件
        run: |
          cd plugins
          zip -r ../sxlb-publisher.zip SxlbPublisher

      # App 与插件分开发布：latest 始终指向 App，plugin-latest 固定指向插件
      - name: 发布 App Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建
          body: |
            版本：${{ steps.version.outputs.value }}（versionCode ${{ steps.version.outputs.code }}）
            提交：${{ github.sha }}
            构建记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: sxlb-writer.apk
          make_latest: true
          overwrite_files: true

      - name: 发布插件 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plugin-latest
          name: 插件最新构建
          body: |
            版本：${{ steps.plugin.outputs.value }}
            提交：${{ github.sha }}
            构建记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            安装：解压后把 SxlbPublisher 目录上传到 usr/plugins/，后台启用即可
          files: sxlb-publisher.zip
          make_latest: false
          overwrite_files: true
