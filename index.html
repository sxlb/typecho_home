<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f5f2" />
    <title>写作</title>
  </head>
  <body>
    <div id="app">
      <!-- 文章列表 -->
      <section id="view-list" class="view">
        <header class="topbar">
          <div class="brand">
            <span class="brand-mark">凉</span>
            <h1>写作</h1>
          </div>
          <div class="topbar-actions">
            <button class="icon-btn" id="btn-refresh" aria-label="刷新">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 11a8 8 0 1 0-2.3 6.3" />
                <path d="M20 5v6h-6" />
              </svg>
            </button>
            <button class="icon-btn" id="btn-settings" aria-label="设置">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3.2" />
                <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
              </svg>
            </button>
          </div>
        </header>
        <div class="list-tools">
          <input
            class="search-input"
            id="list-search"
            type="search"
            placeholder="搜索标题"
            autocomplete="off"
          />
          <div class="chips filters" id="list-filters">
            <button class="chip active" type="button" data-filter="all">全部</button>
            <button class="chip" type="button" data-filter="publish">已发布</button>
            <button class="chip" type="button" data-filter="draft">草稿</button>
            <button class="chip" type="button" data-filter="scheduled">定时</button>
            <button class="chip" type="button" data-filter="local">本地</button>
          </div>
        </div>
        <main class="list-body" id="list-body">
          <div class="list-loading" id="list-loading">加载中…</div>
          <div class="empty" id="list-empty" hidden>
            <p class="empty-title">还没有文章</p>
            <p class="empty-desc">点右下角开始写第一篇</p>
          </div>
          <div id="list-items"></div>
        </main>
        <button class="fab" id="btn-new" aria-label="新建文章">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
      </section>

      <!-- 编辑器 -->
      <section id="view-editor" class="view" hidden>
        <header class="topbar editor-topbar">
          <button class="text-btn" id="btn-back">返回</button>
          <span class="editor-status" id="editor-status"></span>
          <div class="topbar-actions">
            <button class="icon-btn" id="btn-history" aria-label="历史版本">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="8.5" />
                <path d="M12 7.5V12l3 1.8" />
              </svg>
            </button>
            <button class="text-btn" id="btn-save">保存</button>
            <button class="text-btn accent" id="btn-publish">发布</button>
          </div>
        </header>
        <input id="post-title" class="title-input" type="text" placeholder="标题" autocomplete="off" />
        <div class="editor-wrap">
          <div id="editor"></div>
        </div>
      </section>

      <!-- 设置 -->
      <section id="view-settings" class="view" hidden>
        <header class="topbar">
          <button class="text-btn" id="btn-settings-back">返回</button>
          <span class="editor-status">设置</span>
          <div class="topbar-actions"></div>
        </header>
        <main class="settings-body">
          <label class="field">
            <span class="field-label">服务器地址</span>
            <input id="set-server" type="url" placeholder="https://blog.sxlb.xyz" autocomplete="off" />
          </label>
          <label class="field">
            <span class="field-label">Token</span>
            <input id="set-token" type="text" placeholder="X-Sxlb-Token" autocomplete="off" />
          </label>
          <label class="field">
            <span class="field-label">Secret</span>
            <input id="set-secret" type="text" placeholder="HMAC 密钥" autocomplete="off" />
          </label>
          <label class="field">
            <span class="field-label">编辑器模式</span>
            <select id="set-editor-mode">
              <option value="ir">即时渲染（推荐，边写边渲染）</option>
              <option value="wysiwyg">所见即所得（更像 Word，表格可视化编辑）</option>
              <option value="sv">分屏预览（左边源码，右边效果）</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">外观</span>
            <select id="set-theme">
              <option value="auto">跟随系统</option>
              <option value="light">浅色</option>
              <option value="dark">深色</option>
            </select>
          </label>
          <div class="settings-actions">
            <button class="btn ghost" id="btn-test">测试连接</button>
            <button class="btn primary" id="btn-save-settings">保存设置</button>
          </div>
          <div class="update-row">
            <span class="update-version" id="app-version">当前版本</span>
            <button class="btn ghost small" id="btn-check-update">检查更新</button>
          </div>
          <p class="settings-hint">
            Token 与 Secret 在博客后台「插件 → SxlbPublisher 设置」中查看。密钥只保存在本机。<br />
            这里设置的是默认模式；写作时也可以点工具栏「编辑模式」随时切换，切换后会自动记住，正文不会丢。
          </p>
        </main>
      </section>
    </div>

    <!-- 发布抽屉 -->
    <div class="sheet-mask" id="sheet-mask" hidden></div>
    <aside class="sheet" id="sheet" hidden aria-hidden="true">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <span>发布设置</span>
        <button class="icon-btn" id="sheet-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
      <div class="sheet-body">
        <div class="check-panel" id="publish-check" hidden>
          <button type="button" class="check-head" id="check-toggle" aria-expanded="false">
            <span class="check-dot" id="check-dot"></span>
            <span class="check-title" id="check-title">发布检查</span>
            <span class="check-count" id="check-count"></span>
            <span class="check-arrow" aria-hidden="true">▾</span>
          </button>
          <ul class="check-list" id="check-list" hidden></ul>
        </div>
        <div class="field">
          <span class="field-label">分类</span>
          <div class="chips" id="category-chips"></div>
        </div>
        <div class="field">
          <span class="field-label">标签</span>
          <div class="chips tag-chips" id="tag-chips"></div>
          <input id="publish-tags" type="text" placeholder="输入新标签，回车或逗号分隔添加" autocomplete="off" />
        </div>
        <label class="field">
          <span class="field-label">摘要</span>
          <textarea id="publish-summary" rows="3" placeholder="留空则由 AI 自动生成"></textarea>
        </label>
        <div class="field">
          <span class="field-label">缩略图</span>
          <div class="thumb-row">
            <input id="publish-thumb" type="url" placeholder="图片地址" autocomplete="off" />
            <button class="btn ghost small" id="btn-thumb-upload">上传</button>
          </div>
        </div>
        <div class="field-row">
          <label class="field half">
            <span class="field-label">类型</span>
            <select id="publish-reprint">
              <option value="standard">原创</option>
              <option value="reprint">转载</option>
            </select>
          </label>
          <label class="field half">
            <span class="field-label">定时发布</span>
            <input id="publish-created" type="datetime-local" />
          </label>
        </div>
        <label class="field">
          <span class="field-label">固定链接</span>
          <input id="publish-slug" type="text" placeholder="留空自动生成" autocomplete="off" />
        </label>
      </div>
      <div class="sheet-actions">
        <button class="btn ghost" id="btn-draft">存草稿</button>
        <button class="btn primary" id="btn-submit">发布</button>
      </div>
    </aside>

    <!-- 历史版本抽屉 -->
    <div class="sheet-mask" id="history-mask" hidden></div>
    <aside class="sheet" id="history-sheet" hidden aria-hidden="true">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <span>历史版本</span>
        <button class="icon-btn" id="history-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
      <div class="sheet-body" id="history-list"></div>
    </aside>

    <!-- 文章操作抽屉 -->
    <div class="sheet-mask" id="item-mask" hidden></div>
    <aside class="sheet" id="item-sheet" hidden aria-hidden="true">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <span id="item-sheet-title">操作</span>
        <button class="icon-btn" id="item-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
      <div class="sheet-body" id="item-actions"></div>
    </aside>

    <!-- 主题元素面板 -->
    <div class="sheet-mask" id="theme-mask" hidden></div>
    <aside class="sheet" id="theme-sheet" hidden aria-hidden="true">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <span>主题元素</span>
        <button class="icon-btn" id="theme-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
      <div class="sheet-body theme-body">
        <p class="theme-tip">插入主题短代码，发布后由博客主题渲染</p>
        <div class="theme-grid" id="theme-grid"></div>
      </div>
    </aside>

    <!-- 表格操作面板 -->
    <div class="sheet-mask" id="table-mask" hidden></div>
    <aside class="sheet" id="table-sheet" hidden aria-hidden="true">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <span>表格操作</span>
        <button class="icon-btn" id="table-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
      <div class="sheet-body table-body">
        <p class="theme-tip">先点进要编辑的单元格，再选下面的操作</p>
        <div class="table-grid" id="table-grid"></div>
      </div>
    </aside>

    <!-- 片段库面板 -->
    <div class="sheet-mask" id="snippet-mask" hidden></div>
    <aside class="sheet" id="snippet-sheet" hidden aria-hidden="true">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <span>片段库</span>
        <button class="icon-btn" id="snippet-close" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
      <div class="sheet-body snippet-body">
        <p class="theme-tip">点一下插入到光标处，片段只保存在本机</p>
        <div class="snippet-list" id="snippet-list"></div>
        <button class="btn ghost snippet-add" id="snippet-add" type="button">新建片段（带选中文字）</button>
      </div>
    </aside>

    <!-- 主题元素输入弹窗 -->
    <div class="dialog" id="dialog" hidden>
      <div class="dialog-card">
        <h3 class="dialog-title" id="dialog-title">插入</h3>
        <div class="dialog-body" id="dialog-body"></div>
        <div class="dialog-actions">
          <button class="btn ghost" id="dialog-cancel">取消</button>
          <button class="btn primary" id="dialog-ok">插入</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
